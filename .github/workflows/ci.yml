name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python components and check tools
        run: python -m pip install -e './backend[dev]' -e ./adapters/mcp-stdio build twine
      - name: Source audit, lint and types
        run: |
          python scripts/audit-public.py
          ruff check --config backend/pyproject.toml backend adapters/mcp-stdio scripts
          mypy --config-file backend/pyproject.toml backend/alphamobile adapters/mcp-stdio/alphamobile_mcp
      - name: Prepare Android SDK and pinned speech model
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          python scripts/prepare-speech.py
      - name: Build standard app and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease
      - name: Real database, CLI and APK-feed tests
        env:
          ALPHAMOBILE_TEST_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
        run: python -m pytest backend/tests -q
      - name: Build independent Python distributions
        run: |
          python -m build backend
          python -m build adapters/mcp-stdio
          python -m twine check backend/dist/* adapters/mcp-stdio/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-builds
          path: |
            backend/dist/*
            adapters/mcp-stdio/dist/*
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-release.*
          retention-days: 14
