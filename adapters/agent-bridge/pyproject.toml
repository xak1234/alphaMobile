[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alphamobile-agent"
version = "0.3.0"
description = "Always-on alphaMobile agent bridge: answers phone messages and calls from a model or CLI agent"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["mcp==1.29.0", "httpx==0.28.1"]

[project.scripts]
alphamobile-agent = "alphamobile_agent.bridge:main"

[tool.setuptools.packages.find]
include = ["alphamobile_agent*"]

[tool.mypy]
python_version = "3.11"
strict = true
